name: BPAK build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04   # mbedtls 2.x
          - debian:trixie  # mbedtls 3.x
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential cmake pkg-config openssl \
          libmbedtls-dev liblzma-dev \
          libcmocka-dev python3-dev python3-pytest python3-click
    - name: Build
      run: |
        cmake -B build -DBPAK_BUILD_TESTS=1
        cmake --build build -j"$(nproc)"
    - name: Test
      run: ctest --test-dir build --output-on-failure -j"$(nproc)"
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ strategy.job-index }}
        path: |
          build/test/junit/
          build/test/pytest/
        retention-days: 7

  python-package:
    name: python-package (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libmbedtls-dev liblzma-dev openssl
    - name: Install
      run: uv sync --locked
    - name: Lint
      run: |
        uv run ruff check
        uv run ruff format --check
        uv run mypy
        uv run python -m mypy.stubtest bpak._bpak
    - name: Test
      run: uv run pytest test/cli test/python test/golden
    - name: Build sdist and wheel
      run: uv build
    - name: Test the sdist and the wheel
      # pip builds the sdist from source, which also checks that the sdist
      # is complete
      working-directory: ${{ runner.temp }}
      run: |
        uv venv --seed sdist-venv
        sdist-venv/bin/pip install $GITHUB_WORKSPACE/dist/*.tar.gz
        uv venv wheel-venv
        uv pip install --python wheel-venv $GITHUB_WORKSPACE/dist/*.whl
        for venv in sdist-venv wheel-venv; do
          $venv/bin/bpak --version
          $venv/bin/python $GITHUB_WORKSPACE/examples/python/package.py \
            $GITHUB_WORKSPACE/test/data/secp256r1-key-pair.pem \
            $GITHUB_WORKSPACE/test/data/secp256r1-pub-key.der
        done

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v5
    - uses: msys2/setup-msys2@v2
      with:
        install: gcc make cmake
    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBPAK_BUILD_MINIMAL=1
        cmake --build build -j"$(nproc)"

  coverity:
    # Coverity Scan limits the number of submissions, only analyze master
    if: >-
      github.repository == 'jonasblixt/bpak' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libmbedtls-dev liblzma-dev
    - name: Download Coverity Build Tool
      run: |
        curl -fsS https://scan.coverity.com/download/cxx/linux64 \
          --data "token=${TOKEN}&project=jonasblixt%2Fbpak" \
          -o cov-analysis-linux64.tar.gz
        mkdir cov-analysis-linux64
        tar xzf cov-analysis-linux64.tar.gz --strip 1 -C cov-analysis-linux64
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
    - name: Build with cov-build
      run: |
        export PATH=$PWD/cov-analysis-linux64/bin:$PATH
        cmake -B build
        cov-configure --template --compiler gcc --comptype gcc
        cov-build --dir cov-int cmake --build build -j"$(nproc)"
    - name: Submit the result to Coverity Scan
      run: |
        tar czf bpak.tgz cov-int
        curl -fsS \
          --form project=jonasblixt%2Fbpak \
          --form token="$TOKEN" \
          --form email=jonpe960@gmail.com \
          --form file=@bpak.tgz \
          --form version="${GITHUB_SHA::7}" \
          --form description="bpak" \
          https://scan.coverity.com/builds?project=jonasblixt%2Fbpak
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
